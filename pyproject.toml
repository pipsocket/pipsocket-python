[project]
name = "pipsocket"
dynamic = ["version"]
description = "Python client for the Pipsocket API: trade MetaTrader 5 accounts hosted by Pipsocket from Linux, macOS or Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pipsocket", email = "support@pipsocket.com" }]
keywords = ["pipsocket", "trading", "trading-api", "forex", "algotrading", "websocket", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=16.1,<18",
]

[project.urls]
Homepage = "https://pipsocket.com"
Documentation = "https://docs.pipsocket.com"
Source = "https://github.com/pipsocket/pipsocket-python"
Changelog = "https://github.com/pipsocket/pipsocket-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/pipsocket/pipsocket-python/issues"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "h2==4.4.1",
    "anyio==4.16.0",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "datamodel-code-generator[ruff]==0.91.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pipsocket/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "conformance", "scripts", "openapi.json", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipsocket"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/pipsocket/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["PT011"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
strict = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff.lint.isort]
combine-as-imports = true
