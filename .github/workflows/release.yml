name: Release

# A vX.Y.Z tag on main: check the snapshot against the published document, build, test, publish
# to PyPI by trusted publishing, then make a GitHub release from the changelog.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: The tag is on main and matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(uv run python -c 'import pipsocket; print(pipsocket.__version__)')"
          test "v$version" = "$TAG"
          grep -q "^## $version" CHANGELOG.md
      - name: The snapshot matches the published document
        run: |
          curl -sSfL -A "pipsocket-python-release (+https://github.com/pipsocket/pipsocket-python)" \
            https://docs.pipsocket.com/openapi.json -o "$RUNNER_TEMP/live.json"
          uv run python scripts/spec_diff.py openapi.json "$RUNNER_TEMP/live.json"
      - run: uv run python scripts/generate.py --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pipsocket/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v heading="## $version" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
